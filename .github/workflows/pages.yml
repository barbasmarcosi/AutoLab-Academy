name: Test and deploy AutoLab Academy
on:
  push:
    branches: [main, feature/pedagogy-first-redesign]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Hito: ejecutar E2E completo en Chromium y WebKit antes de desplegar'
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
permissions:
  contents: read
# Only superseded PR validations are canceled. Push milestones and main deploys are never canceled
# by a later PR or commit; use run_id for unique non-PR groups.
concurrency:
  group: autolab-${{ github.workflow }}-${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[FULL_E2E_MILESTONE]') && github.sha || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[FULL_E2E_MILESTONE]') }}
jobs:
  verify:
    # Ordinary feature pushes run focused CI only. Full E2E, artifact and Pages
    # publishing remain exclusive to tagged milestones and main releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production and build dependencies for high or critical advisories
        run: npm audit --audit-level=high
      - name: Validate PyBaMM companion syntax
        run: python3 -m py_compile tools/pybamm_export.py
      - name: Unit tests and static checks
        run: npm run build
      - name: Prepare EXACT Pages bundle on PR and main
        run: npm run build:site
      - name: Install Chromium for focused E2E
        run: npx playwright install --with-deps chromium
      - name: Focused pedagogy and offline E2E (Chromium on every PR/dispatch)
        run: npx playwright test tests/e2e/volt-drop-pedagogy.spec.js tests/e2e/dtc-pedagogy.spec.js tests/e2e/dtc-transfer.spec.js tests/e2e/can-pedagogy.spec.js tests/e2e/bms-pedagogy.spec.js tests/e2e/lesson-reasoning.spec.js tests/e2e/learning-evidence.spec.js tests/e2e/academy.spec.js tests/e2e/sw-upgrade.spec.js --project=chromium --grep 'lesson 1|lesson 2|lesson 3|lesson 4|lesson 5|lesson 6|first lesson|PWA instalada|actualización v38|MC06 lesson|MC06 recommendation|path makes reading|MC14:|MOSFET causal'
      - name: Install WebKit for release-milestone E2E
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feature/pedagogy-first-redesign' && contains(github.event.head_commit.message, '[pages-milestone]')))) || (github.event_name == 'workflow_dispatch' && inputs.full_suite) || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[FULL_E2E_MILESTONE]'))
        run: npx playwright install --with-deps webkit
      - name: Browser E2E complete (Chromium, WebKit, mobile WebKit; release milestones only)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feature/pedagogy-first-redesign' && contains(github.event.head_commit.message, '[pages-milestone]')))) || (github.event_name == 'workflow_dispatch' && inputs.full_suite) || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[FULL_E2E_MILESTONE]'))
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autolab-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feature/pedagogy-first-redesign' && contains(github.event.head_commit.message, '[pages-milestone]')))) || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./site/AutoLab-Academy
  deploy:
    # github-pages permits default-branch deployment only. Validated feature
    # milestones are published by publish-pedagogy-pages.yml from main.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full_suite && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
