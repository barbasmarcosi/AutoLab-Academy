name: Test and deploy AutoLab Academy
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified dependencies
        run: npm install --no-audit --no-fund
      - name: Tests and static checks
        run: npm run build
      - name: Prepare public site (exclude repository metadata)
        if: github.event_name != 'pull_request'
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js site/
          cp -R src icons site/
          mkdir -p site/samples
          cp samples/autolab-synthetic.dbc site/samples/
      - name: Bundle web modules with Candied for offline Pages
        if: github.event_name != 'pull_request'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --format=esm --target=es2020 --minify --outfile=site/src/app.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
