name: Test and deploy AutoLab Academy
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate PyBaMM companion syntax
        run: python3 -m py_compile tools/pybamm_export.py
      - name: Unit tests and static checks
        run: npm run build
      - name: Prepare EXACT Pages bundle on PR and main
        run: npm run build:site
      - name: Install Chromium and WebKit dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Browser E2E (Chromium/WebKit, diagnostics, backup, offline, a11y)
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autolab-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site/AutoLab-Academy
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
