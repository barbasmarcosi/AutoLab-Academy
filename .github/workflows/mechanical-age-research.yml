name: Mechanical age research — validation only
on:
  push:
    branches:
      - research/mechanical-age-obd-v0
  workflow_dispatch:
# Superseded push validations cancel; manual audits use an independent group.
concurrency:
  group: ma00-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Mechanical age unit and PWA offline tests
        run: node --test tests/mechanical-age-research.test.js tests/service-worker.test.js
      - name: Validate raw PID capture bridge and AA no-intervention research
        run: node --test tests/mechanical-age-raw-obd.test.js tests/mechanical-age-bridge.test.js tests/mechanical-age-aa-view.test.js tests/mechanical-age-python-serial.test.js
      - name: Verify source dataset audit and mock ELM327 serial (no connected hardware)
        run: |
          python3 -m unittest discover -s tests/science -p 'test_mechanical_age_dataset.py'
          python3 -m unittest discover -s tests/science -p 'test_ma00_elm327_serial.py'
      - name: Regime overlap negative controls (no real source download)
        run: node --test tests/mechanical-age-regime-overlap.test.js
      - name: Full unit tests and static checks
        run: npm run build
      - name: Build independent preview bundle (without publishing)
        run: npm run build:site
      - name: Install Chromium and WebKit for dedicated research E2E
        run: npx playwright install --with-deps chromium webkit
      - name: MA00 browser E2E (desktop/mobile, untrusted inputs, offline)
        run: npx playwright test tests/e2e/mechanical-age.spec.js
      - name: Research E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ma00-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  empirical-enginefault:
    name: Audit pinned real laboratory sensor dataset (no model training)
    # Opt-in research benchmark: explicit dispatch or ONE commit tagged for the audit.
    # Normal pushes never re-download the identical pinned source.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[MA00 empirical once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch published dataset at immutable upstream commit
        run: |
          mkdir -p /tmp/ma00
          curl -fSL --retry 2 --max-time 90 --max-filesize 6000000 \
            "https://raw.githubusercontent.com/leoxthomas/EngineFaultDB/c63f23ba048761d9c2a2c95d8fb4c0392a3c63d3/EngineFaultDB_Final.csv" \
            -o /tmp/ma00/EngineFaultDB_Final.csv
      - name: Verify git blob SHA and audit every source row
        run: |
          node tools/audit-enginefaultdb.mjs /tmp/ma00/EngineFaultDB_Final.csv > /tmp/ma00/enginefault-audit.json
          node -e 'const a=require(process.argv[1]); console.log(JSON.stringify({rows:a.observationCount,classes:a.faultClassCounts,duplicates:a.exactDuplicateRows,labelRuns:a.contiguousLabelRuns,wearGroundTruth:a.wearGroundTruthPresent,sourceBlob:a.provenance.gitBlobSha},null,2))' /tmp/ma00/enginefault-audit.json
      - name: Evaluate operational confounding with coarsened RPM/MAP/TPS overlap
        run: |
          node tools/benchmark-enginefaultdb.mjs /tmp/ma00/EngineFaultDB_Final.csv > /tmp/ma00/enginefault-regime-overlap.json
          node -e 'const x=require(process.argv[1]); for(const s of x.sensitivityGrid) for(const [label,c] of Object.entries(s.comparisons)) console.log(JSON.stringify({grid:s.requestedBins,group:label,overlapCells:c.overlapCells,matchedFraction:c.matchedWeightFractionOfSmallerGroup,rawCO:c.rawMeanDelta.CO,regimeMatchedCO:c.matchedRegimeDelta?.CO??null,eligible:c.interpretationAllowed}));' /tmp/ma00/enginefault-regime-overlap.json
      - name: Upload aggregated audit only — never raw third-party data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ma00-enginefault-aggregated-audit
          path: |
            /tmp/ma00/enginefault-audit.json
            /tmp/ma00/enginefault-regime-overlap.json
          retention-days: 14

  empirical-dieselobd:
    name: Inventory pinned real DieselOBD train/test workbooks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install XLSX reader (do not reinvent workbook parsing)
        run: python3 -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Fetch upstream snapshot by immutable commit
        run: |
          mkdir -p /tmp/ma00
          curl -fSL --retry 2 --max-time 120 --max-filesize 10000000 \
            "https://raw.githubusercontent.com/AbouAbdallah-Lounis/OBD-Dataset/a9c96dc146aeeb62ef75d3b453c238f5379ccff5/MASTER_TRAIN_X.xlsx" \
            -o /tmp/ma00/MASTER_TRAIN_X.xlsx
          curl -fSL --retry 2 --max-time 120 --max-filesize 3000000 \
            "https://raw.githubusercontent.com/AbouAbdallah-Lounis/OBD-Dataset/a9c96dc146aeeb62ef75d3b453c238f5379ccff5/MASTER_TEST_X.xlsx" \
            -o /tmp/ma00/MASTER_TEST_X.xlsx
      - name: Verify blob hashes and measure actual workbook coverage
        run: |
          python3 tools/audit_dieselobd_workbooks.py /tmp/ma00/MASTER_TRAIN_X.xlsx /tmp/ma00/MASTER_TEST_X.xlsx > /tmp/ma00/dieselobd-audit.json
          python3 -c 'import json; data=json.load(open("/tmp/ma00/dieselobd-audit.json")); print(json.dumps([{"file":f["sourceFile"],"sheets":[{"rows":s["rows"],"columns":s["columnCount"],"vehicles":s["distinctVehicleCount"],"pids":s["obdPidColumns"],"dtcs":s["dtcColumns"]} for s in f["sheets"]]} for f in data],indent=2))'
      - name: Publish aggregate-only workbook inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ma00-dieselobd-aggregated-inventory
          path: /tmp/ma00/dieselobd-audit.json
          retention-days: 14
