name: Mechanical age research — validation only
on:
  push:
    branches:
      - research/mechanical-age-obd-v0
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Mechanical age unit and PWA offline tests
        run: node --test tests/mechanical-age-research.test.js tests/service-worker.test.js
      - name: Full unit tests and static checks
        run: npm run build
      - name: Build independent preview bundle (without publishing)
        run: npm run build:site
